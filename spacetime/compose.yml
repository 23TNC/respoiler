services:
  shell:
    image: clockworklabs/spacetime:latest
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/etc/spacetimedb
      - ./data:/home/spacetime/.local/share/spacetime/data
      - ./server:/workspace/server
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true

  start:
    image: clockworklabs/spacetime:latest
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/etc/spacetimedb
      - ./data:/home/spacetime/.local/share/spacetime/data
      - ./server:/workspace/server
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    command:
      - start
      - --listen-addr=0.0.0.0:3000
      - --jwt-priv-key-path 
      - /etc/spacetimedb/id_ecdsa
      - --jwt-pub-key-path 
      - /etc/spacetimedb/id_ecdsa.pub

  build:
    image: clockworklabs/spacetime:latest
    volumes:
      - ./server:/workspace/server
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    command:
      - build

  bindings:
    image: clockworklabs/spacetime:latest
    volumes:
      - ./server:/workspace/server
      - ../pixijs:/workspace/pixijs
    working_dir: /workspace/server
    entrypoint: ["/bin/bash"]
    command:
      - generate-bindings.sh
